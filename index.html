<style>
:root{
  --bg:#FFFFFF; --s1:#F6F5F3; --s2:#EEECE8; --line:#E4E1DB; --ink:#17140F; --ink2:#3B362E; --mute:#716B62;
  --or:#E2560A; --or2:#C34807; --orsoft:#FFF1E7; --orline:#F6C9AA;
  --ok:#14874C; --oksoft:#E6F5EC; --red:#C8322A; --redsoft:#FCEBEA; --wa:#25D366;
  --display:"Big Shoulders Display", Impact, sans-serif;
  --body:"Instrument Sans", system-ui, sans-serif;
  --r-s:12px; --r-m:16px; --r-l:22px;
  --shadow:0 1px 2px rgba(23,20,15,.04),0 6px 20px rgba(23,20,15,.06);
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--or);outline-offset:3px;border-radius:6px}
h2:focus,h1:focus{outline:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- app shell ---------- */
.app{position:relative;max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);overflow-x:clip}
@media(min-width:720px){
  body{background:var(--s1);padding:32px 0}
  .app{min-height:calc(100vh - 64px);border-radius:28px;border:1px solid var(--line);overflow:hidden;box-shadow:0 30px 80px rgba(23,20,15,.10)}
}
.screen{display:none;flex:1;flex-direction:column;padding:8px 22px 130px}
.screen.on{display:flex;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes inback{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.screen.back-anim.on{animation-name:inback}
html[dir=rtl] .screen.on{animation-name:inback}
html[dir=rtl] .screen.back-anim.on{animation-name:in}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:15;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(12px + var(--safe-t)) 22px 14px}
.top .row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.back{width:42px;height:42px;border-radius:50%;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 42px}
.back:hover{border-color:var(--ink2)}
html[dir=rtl] .back svg{transform:scaleX(-1)}
.count{flex:1;min-width:0;font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count b{color:var(--ink);font-weight:700}
.mini{display:none;font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--or)}
@media(min-width:440px){.mini{display:block}}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;list-style:none}
.steps li{height:4px;border-radius:4px;background:var(--s2);transition:background .3s}
.steps li.on{background:var(--or)}

h2{font-family:var(--display);font-weight:800;font-size:42px;line-height:1;letter-spacing:.2px;margin-top:10px}
.sub{color:var(--mute);font-size:15px;margin:8px 0 22px}

/* ---------- home ---------- */
.home{padding-top:calc(16px + var(--safe-t))}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:11px}
.pole{width:9px;height:42px;border-radius:5px;flex:0 0 9px;
  background:repeating-linear-gradient(-45deg,var(--or) 0 6px,#fff 6px 12px,var(--ink) 12px 18px,#fff 18px 24px);
  background-size:100% 34px;animation:pole 2.4s linear infinite;box-shadow:0 0 0 2px var(--ink)}
@keyframes pole{to{background-position:0 34px}}
.sign{font-family:var(--display);font-weight:900;line-height:.82;letter-spacing:.4px;text-transform:uppercase;font-size:30px}
.sign small{display:block;font-size:.44em;letter-spacing:.34em;color:var(--or);font-weight:800;margin-top:4px}
.lang{position:relative}
.lang-btn{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 13px 0 11px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);font-weight:700;font-size:14px;transition:border-color .15s}
.lang-btn:hover,.lang-btn[aria-expanded=true]{border-color:var(--ink)}
.lang-btn .chev{color:var(--mute);transition:transform .2s}
.lang-btn[aria-expanded=true] .chev{transform:rotate(180deg)}
.lang-menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:30;min-width:190px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 18px 40px rgba(23,20,15,.16);animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.lang-menu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 14px;border-radius:11px;font-size:15px;font-weight:600;text-align:start;min-height:48px}
.lang-menu button:hover{background:var(--s1)}
.lang-menu button i{font-style:normal;font-size:12px;font-weight:800;color:var(--mute);background:var(--s1);border-radius:6px;padding:2px 7px;min-width:30px;text-align:center}
.lang-menu button[aria-checked=true]{background:var(--orsoft);color:var(--or2)}
.lang-menu button[aria-checked=true] i{background:var(--or);color:#fff}
.lang-menu button[lang=ar] span,.lang-menu button[lang=ar] i{font-family:"Noto Kufi Arabic",sans-serif}

.welcome{margin-top:30px}
.welcome h1{font-family:var(--display);font-weight:900;font-size:50px;line-height:.95;letter-spacing:.2px}
.welcome p{color:var(--mute);font-size:16px;margin-top:10px;max-width:32ch;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;background:var(--s1);font-size:13px;font-weight:600;color:var(--ink2)}
.chip.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--oksoft)}
.chip.status.closed i{background:var(--red);box-shadow:0 0 0 3px var(--redsoft)}
.chip.status b{font-weight:700}

.next{margin-top:22px;background:var(--or);color:#fff;border-radius:var(--r-l);padding:20px;box-shadow:0 14px 34px rgba(226,86,10,.28);position:relative;overflow:hidden}
.next::after{content:"";position:absolute;top:-30px;inset-inline-end:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)}
.next .k{font-size:13px;color:#FFE3D1;display:flex;align-items:center;gap:8px;position:relative}
.next .dot{width:8px;height:8px;border-radius:50%;background:#fff;flex:0 0 8px;animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%{box-shadow:0 0 0 9px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.next .v{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.05;margin:6px 0 16px;position:relative}
.next .v.load{opacity:.5}
.next .cta{background:#fff;color:var(--or2);position:relative}
.next .cta:hover{background:var(--orsoft)}

.trust{list-style:none;display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;padding:0 4px}
.trust li{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.trust svg{width:16px;height:16px;color:var(--ok)}

.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.quick a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:var(--r-m);background:var(--bg);border:1px solid var(--line);text-decoration:none;font-size:13px;font-weight:700;transition:border-color .15s}
.quick a:hover{border-color:var(--ink2)}
.quick a i{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--s1);color:var(--ink)}
.quick a.wa i{background:#E8F9EE;color:#0B7A3B}
.quick a i svg{width:21px;height:21px}

.block{margin-top:30px}
.block h3{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:.2px;margin-bottom:12px}
.bhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.seeall{color:var(--or2);font-weight:700;font-size:14px}
.svc-strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:22px;margin:0 -22px;padding:2px 22px 8px;scrollbar-width:none}
.svc-strip::-webkit-scrollbar{display:none}
.svc-strip button{flex:0 0 46%;max-width:200px;scroll-snap-align:start;text-align:start;border-radius:var(--r-m);overflow:hidden;background:var(--bg);border:1px solid var(--line);position:relative;transition:transform .1s}
.svc-strip button:active{transform:scale(.97)}
.svc-strip .n{font-weight:700;font-size:14.5px;padding:10px 12px 0;line-height:1.25}
.svc-strip .pr{display:flex;justify-content:space-between;align-items:baseline;padding:2px 12px 12px;font-size:12px;color:var(--mute)}
.svc-strip .pr b{font-family:var(--display);font-weight:800;font-size:21px;color:var(--ink)}
.svc-strip .tag{position:absolute;top:8px;inset-inline-start:8px;z-index:2}

.infocard{background:var(--s1);border-radius:var(--r-l);padding:6px 18px}
.hours{list-style:none}
.hours li{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);color:var(--mute);font-size:15px}
.hours li.today{color:var(--ink);font-weight:700}
.addr{display:flex;align-items:center;gap:10px;padding:14px 0;text-decoration:none;font-weight:600;font-size:15px}
.addr svg{width:20px;height:20px;color:var(--or);flex:0 0 20px}
.addr span{flex:1}
.addr b{color:var(--or2);font-size:14px}
.contact{display:grid;gap:10px}
.demo{margin-top:16px;padding:10px 12px;border-radius:var(--r-s);background:var(--orsoft);color:var(--or2);font-size:13px}
.textlink{display:block;text-align:center;margin-top:26px;color:var(--mute);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.foot{text-align:center;color:#A39E95;font-size:12px;margin-top:14px}

/* tswira kamla: blur f l-khelfiya + l-image kamla f l-wsst */
.fullimg{position:relative;overflow:hidden;background:var(--orsoft)}
.fullimg .bgi{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);object-fit:cover;filter:blur(14px) saturate(1.1);opacity:.55;transform:scale(1.05)}
.fullimg .fg{position:relative;width:100%;height:100%;object-fit:contain;display:block}
.svc-strip .fullimg{aspect-ratio:4/5}

/* ---------- buttons ---------- */
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--or);color:#fff;font-weight:700;border-radius:999px;padding:16px 24px;font-size:16px;text-decoration:none;transition:background .15s,transform .1s;white-space:nowrap;min-height:54px}
.cta:hover{background:var(--or2)}
.cta:active{transform:scale(.97)}
.cta:disabled{background:var(--s2);color:#A8A39A;cursor:not-allowed}
.cta.block-btn{width:100%}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;transition:transform .1s,background .15s,border-color .15s;min-height:54px}
.btn:active{transform:scale(.98)}
.btn.wa{background:var(--wa);color:#05290F}
.btn.ghost{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink2)}
.btn.danger{background:transparent;border:1.5px solid #F0C3BF;color:var(--red)}
.btn.danger:hover{background:var(--redsoft)}
.btn.danger.armed{background:var(--red);border-color:var(--red);color:#fff}
.link{color:var(--or2);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.textlink{display:inline-block;margin-top:14px;color:var(--mute);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.textlink:hover{color:var(--ink)}

/* ---------- services (cartes b tswira) ---------- */
.svc{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.svc button{position:relative;display:flex;flex-direction:column;text-align:start;border-radius:var(--r-m);background:var(--bg);border:1.5px solid var(--line);overflow:hidden;transition:border-color .15s,box-shadow .15s,transform .1s}
.svc button:hover{border-color:#CFCAC1}
.svc button:active{transform:scale(.98)}
.svc button[aria-pressed=true]{border-color:var(--or);box-shadow:0 0 0 3px var(--orsoft)}
.svc .ph{position:relative;aspect-ratio:4/5;background:var(--orsoft);display:grid;place-items:center;overflow:hidden}
.svc .ph .bgi{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);object-fit:cover;filter:blur(14px) saturate(1.1);opacity:.55}
.svc .ph .fg{position:relative;width:100%;height:100%;object-fit:contain;display:block}
.svc .ph svg{width:38%;height:auto;color:var(--or);opacity:.85}

.svc .ph.noimg::after{display:none}
.svc .body{padding:11px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.svc .n{font-weight:700;font-size:16px;line-height:1.25}
.svc .d{font-size:12.5px;color:var(--mute);line-height:1.35;flex:1}
.svc .meta{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:8px}
.svc .meta b{font-family:var(--display);font-weight:800;font-size:23px;line-height:1;color:var(--ink)}
.svc button[aria-pressed=true] .meta b{color:var(--or2)}
.svc .meta span{font-size:12px;color:var(--mute);white-space:nowrap}
.svc .box{position:absolute;top:10px;inset-inline-end:10px;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.svc .tag{position:absolute;top:10px;inset-inline-start:10px;z-index:2}
.tag{font-size:11px;font-weight:700;color:#fff;background:var(--ink);padding:2px 8px;border-radius:99px}
.box{width:26px;height:26px;border-radius:8px;border:1.5px solid #CFCAC1;display:grid;place-items:center;transition:.15s;background:#fff}
.box svg{opacity:0;transform:scale(.6);transition:.15s}
[aria-pressed=true] .box,[aria-checked=true] .box{background:var(--or);border-color:var(--or)}
[aria-pressed=true] .box svg,[aria-checked=true] .box svg{opacity:1;transform:none}

/* ---------- team ---------- */
.team{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.team button{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:22px 10px 18px;border-radius:var(--r-m);background:var(--bg);border:1.5px solid var(--line);transition:border-color .15s,background .15s}
.team button:hover{border-color:#CFCAC1}
.team button[aria-checked=true]{border-color:var(--or);background:var(--orsoft)}
.team .any{grid-column:1/-1;flex-direction:row;text-align:start;padding:16px 18px;gap:14px}
.team .any .tx{flex:1}
.av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:32px;color:var(--or2);background:var(--orsoft);overflow:hidden;box-shadow:0 0 0 3px #fff,0 0 0 4.5px var(--orline);flex:0 0 auto}
.av img{width:100%;height:100%;object-fit:cover}
.team-strip .av{width:64px;height:64px;font-size:28px}
.any .av{width:50px;height:50px;font-size:22px;background:#fff;color:var(--or);box-shadow:none;border:1.5px dashed var(--or)}
.team .n{font-weight:700;font-size:16px}
.team .d{font-size:13px;color:var(--mute)}
.team .d.off{color:var(--red)}

/* ---------- days ---------- */
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:420px){.days{grid-template-columns:repeat(5,1fr)}}
.days button{padding:12px 0 10px;border-radius:var(--r-m);background:var(--bg);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:1px;min-height:86px;justify-content:center}
.days button:hover:not(:disabled){border-color:#CFCAC1}
.days button[aria-checked=true]{background:var(--or);border-color:var(--or);color:#fff}
.days button[aria-checked=true] .w,.days button[aria-checked=true] .m{color:#FFE3D1}
.days button:disabled{background:var(--s1);border-color:transparent;color:#B9B4AB;cursor:not-allowed}
.days button:disabled .w,.days button:disabled .m{color:#C6C1B8}
.days .w{font-size:12px;color:var(--mute);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.days .n{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05}
.days .m{font-size:11px;color:var(--mute)}
.weeklabel{font-size:13px;color:var(--mute);margin:18px 0 8px;font-weight:600}
.weeklabel:first-child{margin-top:0}

/* ---------- times ---------- */
.daychip{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--s1);border-radius:var(--r-m);padding:12px 16px;margin-bottom:6px}
.daychip b{font-weight:700}
.daychip span{font-size:13px;color:var(--mute);display:block}
.daychip button{color:var(--or2);font-weight:700;font-size:14px}
.period{font-size:13px;color:var(--mute);margin:18px 0 8px;font-weight:600}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.times button{position:relative;padding:14px 0;border-radius:var(--r-s);background:var(--bg);border:1.5px solid var(--line);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;min-height:50px}
.times button:hover:not(:disabled){border-color:#CFCAC1}
.times button[aria-checked=true]{background:var(--or);border-color:var(--or);color:#fff}
.times button:disabled{background:var(--s1);border-color:transparent;color:#C6C1B8;text-decoration:line-through;cursor:not-allowed}
.times button.best:not([aria-checked=true]){border-color:var(--orline);background:var(--orsoft)}
.times button .pr{position:absolute;top:-8px;inset-inline-end:-4px;font-size:10px;font-weight:800;background:var(--ink);color:#fff;border-radius:99px;padding:1px 6px;line-height:1.5;text-decoration:none}
.times button:disabled .pr{display:none}
.promo-hint{font-size:13px;color:var(--or2);font-weight:600;margin-top:-10px;margin-bottom:6px}
.skel{height:50px;border-radius:var(--r-s);background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.note{background:var(--s1);border-radius:var(--r-m);padding:24px;text-align:center;color:var(--mute);font-size:15px;margin-top:14px}
.note .cta{margin-top:14px}
.note .link{display:inline-block;margin-top:10px}

/* ---------- infos ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}
.field input{width:100%;background:var(--s1);border:1.5px solid var(--line);border-radius:var(--r-m);padding:16px;font-size:17px;transition:border-color .15s,background .15s;min-height:56px}
.field input:focus{outline:none;border-color:var(--or);background:#fff}
.field input[aria-invalid=true]{border-color:var(--red)}
.field .help{font-size:13px;color:var(--mute);margin-top:6px}
.field .help.err{color:var(--red)}
.recap{background:var(--s1);border-radius:var(--r-m);padding:4px 16px;margin-bottom:22px}
.recap div{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px dashed #D8D4CC;font-size:15px}
.recap div:last-child{border:0}
.recap span{color:var(--mute)}
.recap b{font-weight:700;text-align:end}
.recap .tot b{font-family:var(--display);font-weight:800;font-size:28px;color:var(--or2)}
.recap .disc b{color:var(--ok)}
.recap button{color:var(--or2);font-size:13px;font-weight:700;margin-inline-start:8px;padding:4px 0}
.formerr{color:var(--red);font-size:14px;text-align:center;min-height:20px;margin-top:4px}
.loyal{border-radius:var(--r-m);padding:14px 16px;margin:0 0 16px;background:var(--orsoft);border:1px solid var(--orline);font-size:14px;color:var(--or2);font-weight:600}
.loyal.win{background:var(--or);border-color:var(--or);color:#fff}
.dots{display:flex;gap:5px;margin-top:9px}
.dots i{flex:1;height:6px;border-radius:6px;background:#F6D7C3}
.dots i.on{background:var(--or)}
.loyal.win .dots i{background:rgba(255,255,255,.4)}.loyal.win .dots i.on{background:#fff}

/* ---------- action bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 22px calc(12px + var(--safe-b))}
.bar .in{max-width:516px;margin:0 auto;display:flex;align-items:center;gap:14px}
@media(min-width:720px){.bar{position:sticky;bottom:0;margin-top:auto}}
.bar .sum{flex:1;min-width:0;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sum b{display:block;font-family:var(--display);font-weight:800;font-size:27px;color:var(--ink);line-height:1.05}
.bar .cta{min-width:150px}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- ticket ---------- */
.done{text-align:center;padding-top:calc(30px + var(--safe-t));background:var(--s1)}
.ticket{position:relative;background:#fff;color:var(--ink);border-radius:16px;margin:20px auto 24px;width:100%;max-width:360px;text-align:start;box-shadow:var(--shadow);overflow:visible;animation:print .6s cubic-bezier(.2,.8,.2,1)}
@keyframes print{from{transform:translateY(-24px);opacity:0;clip-path:inset(0 0 100% 0)}to{transform:none;opacity:1;clip-path:inset(0 0 0 0)}}
.ticket .tp{padding:20px 22px 18px;text-align:center;background:var(--or);color:#fff;border-radius:16px 16px 0 0}
.ticket .brand{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.06em;text-transform:uppercase}
.ticket .addr{font-size:12px;color:#FFE3D1}
.ticket .when{font-family:var(--display);font-weight:900;font-size:64px;line-height:.9;margin:14px 0 4px}
.ticket .day{font-weight:700;font-size:16px}
.ticket .tear{position:relative;height:0;border-top:2px dashed var(--line);margin:0 18px}
.ticket .tear::before,.ticket .tear::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--s1)}
.ticket .tear::before{left:-30px}.ticket .tear::after{right:-30px}
.ticket dl{padding:16px 22px 6px;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.ticket dt{color:var(--mute)}
.ticket dd{text-align:end;font-weight:700}
.ticket .ref{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 18px;font-size:13px;color:var(--mute)}
.ticket .ref b{font-family:var(--display);font-weight:800;font-size:21px;color:var(--ink);letter-spacing:.08em}
/* ticket pro */
.ticket.pro{border-radius:22px;overflow:hidden;box-shadow:0 18px 40px -18px rgba(23,20,15,.35),0 2px 6px rgba(23,20,15,.06)}
.ticket.pro .tp{position:relative;padding:18px 20px 22px;border-radius:0;text-align:center;background:linear-gradient(150deg,var(--or) 0%,var(--or2) 100%);overflow:hidden}
.ticket.pro .tp::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.07) 0 14px,transparent 14px 28px);pointer-events:none}
.ticket.pro .tp>*{position:relative}
.tk-head{display:flex;flex-direction:column;align-items:center;gap:10px}
.tk-logo{display:flex;align-items:center;gap:8px;min-width:0;text-align:start}
.tk-logo .pl{width:9px;height:26px;border-radius:5px;flex:0 0 9px;background:repeating-linear-gradient(-45deg,#fff 0 4px,var(--ink) 4px 8px);box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.tk-logo b{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.06em;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;white-space:nowrap;backdrop-filter:blur(4px)}
.tk-st i{width:8px;height:8px;border-radius:50%;background:#FFD166;box-shadow:0 0 0 0 rgba(255,209,102,.7);animation:pulse 1.6s infinite}
.tk-st.c{background:#fff;color:var(--ok)}.tk-st.c i{background:var(--ok);animation:none}
.tk-st.x{background:#fff;color:var(--red)}.tk-st.x i{background:var(--red);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(255,209,102,0)}100%{box-shadow:0 0 0 0 rgba(255,209,102,0)}}
.ticket.pro .when{font-size:76px;margin:12px 0 2px;letter-spacing:.01em;text-shadow:0 2px 0 rgba(0,0,0,.08)}
.ticket.pro .day{font-size:16px;opacity:.95}
.tk-cd{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:7px 14px;border-radius:999px;background:rgba(23,20,15,.22);font-weight:800;font-size:13.5px}
.tk-cd svg{width:15px;height:15px}
.tk-barber{display:flex;align-items:center;gap:12px;padding:16px 20px 4px}
.tk-barber .av{width:48px;height:48px;flex:0 0 48px;border-radius:50%;background:var(--orsoft);color:var(--or);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:22px;overflow:hidden;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--orline)}
.tk-barber .av img{width:100%;height:100%;object-fit:cover}
.tk-barber small{display:block;font-size:12px;font-weight:600;color:var(--mute)}
.tk-barber b{font-size:17px;font-weight:800}
.tk-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:16px 16px 18px;position:relative}
.tk-steps li{list-style:none;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11.5px;font-weight:700;color:var(--mute);position:relative;line-height:1.25}
.tk-steps li::before{content:"";position:absolute;top:13px;inset-inline-start:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.tk-steps li:first-child::before{display:none}
.tk-steps li.ok::before,.tk-steps li.cur::before{background:var(--ok)}
.tk-steps li span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--line);position:relative;z-index:1;font-size:13px;color:var(--mute)}
.tk-steps li.ok{color:var(--ink)}.tk-steps li.ok span{background:var(--ok);border-color:var(--ok);color:#fff}
.tk-steps li.cur{color:var(--or2)}.tk-steps li.cur span{border-color:var(--or);color:var(--or)}
.tk-steps li.cur span::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--or);opacity:.35;animation:ring 1.6s infinite}
.tk-steps li.x{color:var(--red)}.tk-steps li.x span{background:var(--red);border-color:var(--red);color:#fff}
@keyframes ring{from{transform:scale(.8);opacity:.5}to{transform:scale(1.25);opacity:0}}
.tk-items{padding:16px 20px 4px;display:grid;gap:9px;font-size:14.5px}
.tk-items .it{display:flex;justify-content:space-between;gap:12px}
.tk-items .it span{color:var(--ink2);font-weight:600}.tk-items .it b{font-weight:800;white-space:nowrap}
.tk-items .it.dc b,.tk-items .it.dc span{color:var(--ok)}
.tk-items .it.meta span,.tk-items .it.meta b{color:var(--mute);font-weight:600;font-size:13px}
.tk-tot{display:flex;justify-content:space-between;align-items:baseline;margin:6px 20px 0;padding:12px 0 4px;border-top:1.5px solid var(--line)}
.tk-tot span{font-weight:700;color:var(--mute);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.tk-tot b{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;color:var(--ink)}
.tk-ref{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 20px 4px;padding:10px 12px 10px 14px;border-radius:14px;background:var(--s1)}
.tk-ref small{display:block;font-size:11.5px;font-weight:700;color:var(--mute)}
.tk-ref b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.1em}
.tk-ref button{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px;background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.tk-ref button svg{width:15px;height:15px}
.ticket.pro .barcode{margin:12px 20px 16px;height:42px;background:none;display:flex;align-items:stretch;gap:0;opacity:1}
.ticket.pro .barcode i{display:block;background:var(--ink);border-radius:1px;min-width:1px}
.ticket.pro .tk-map{margin:0 14px 14px}
.ticket.pro.conf .tp{background:linear-gradient(150deg,var(--or) 0%,var(--or2) 100%)}
.ticket.pro.ref .tp{background:linear-gradient(150deg,#6b655c,#3d3a35)}
.ticket.pro.pop{animation:tkpop .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes tkpop{40%{transform:scale(1.03)}}
.tk-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:360px;margin:0 auto 14px}
.tk-tools .tool{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px;border-radius:16px;background:#fff;border:1.5px solid var(--line);color:var(--ink);font-weight:700;font-size:12.5px;text-decoration:none;transition:transform .1s,border-color .15s}
.tk-tools .tool:active{transform:scale(.96)}
.tk-tools .tool i{width:40px;height:40px;border-radius:50%;background:var(--orsoft);color:var(--or);display:grid;place-items:center}
.tk-tools .tool i svg{width:20px;height:20px}
.tk-tips{width:100%;max-width:360px;margin:0 auto 18px;text-align:start;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.tk-tips b{display:block;font-size:14px;margin-bottom:8px}
.tk-tips ul{margin:0;padding:0;display:grid;gap:8px}
.tk-tips li{list-style:none;display:flex;gap:10px;font-size:13.5px;line-height:1.45;color:var(--ink2)}
.tk-tips li em{font-style:normal;flex:0 0 22px;height:22px;border-radius:50%;background:var(--orsoft);color:var(--or2);display:grid;place-items:center;font-size:12px;font-weight:800}
.tk-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:12px 18px;border-radius:999px;z-index:210;transition:.3s;max-width:90vw;text-align:center;pointer-events:none}
.tk-toast.on{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translate3d(var(--dx),105vh,0) rotate(var(--r));opacity:.9}}
.barcode{height:34px;margin:0 22px 18px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px);opacity:.85;border-radius:2px}
.acts{display:grid;gap:10px;width:100%;max-width:360px;margin:0 auto}
.tk-map{display:flex;align-items:center;gap:12px;margin:0 12px 12px;padding:12px;border-radius:12px;background:var(--s1);text-decoration:none;color:var(--ink);text-align:start}
.tk-map i{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:var(--orsoft);color:var(--or);display:grid;place-items:center}
.tk-map i svg{width:19px;height:19px}
.tk-map span{flex:1;min-width:0;font-weight:700;font-size:14px;line-height:1.3}
.tk-map small{display:block;font-weight:600;font-size:11.5px;color:var(--mute)}
.tk-map b{display:inline-flex;align-items:center;gap:6px;background:var(--or);color:#fff;border-radius:999px;padding:8px 12px;font-size:13px;white-space:nowrap}
.tk-map b svg{width:14px;height:14px}
.social{display:flex;flex-direction:column;align-items:center;gap:10px;margin:2px auto 22px;max-width:360px}
.social>span{font-size:13px;font-weight:700;color:var(--mute)}
.social>div{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%}
.social a{flex:1;min-width:140px;display:flex;align-items:center;justify-content:center;gap:9px;min-height:50px;border-radius:999px;text-decoration:none;font-weight:700;font-size:14.5px;color:#fff}
.social a svg{width:20px;height:20px}
.social a.ig{background:linear-gradient(45deg,#F58529,#DD2A7B 50%,#8134AF)}
.social a.fb{background:#1877F2}
.home .social{margin-top:26px}
.small{font-size:13px;color:var(--mute);margin-top:16px}
.small a{color:var(--or2)}

/* ---------- cards / misc ---------- */
.card{margin-top:16px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-l);padding:18px 20px;box-shadow:var(--shadow)}
.card .k{font-size:13px;color:var(--or2);font-weight:700}
.card .v{font-weight:700;font-size:17px;margin:4px 0 2px}
.card .s{font-size:14px;color:var(--mute)}
.card .acts2{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.card .acts2 .btn{flex:1;min-height:46px;padding:12px;font-size:15px}
.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none;margin:0 -22px;padding-inline:22px}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 70%;max-width:300px;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r-m);scroll-snap-align:start;background:var(--s1)}
.wait{margin-top:14px;text-align:start}
.wait .field{margin-bottom:10px}
.ok-msg{background:var(--oksoft);border:1px solid #BFE3CD;color:var(--ok);border-radius:var(--r-m);padding:14px 16px;font-size:14px;font-weight:600;margin-top:14px}
.err-msg{color:var(--red);font-size:14px;margin-top:10px;min-height:20px}
.manage .backlink{display:inline-flex;align-items:center;gap:8px;color:var(--mute);font-weight:600;margin-bottom:6px;padding:8px 0}
html[dir=rtl] .manage .backlink svg{transform:scaleX(-1)}

/* ---------- arabic ---------- */
html[lang=ar] body{font-family:"Noto Kufi Arabic","Instrument Sans",sans-serif;line-height:1.7}
html[lang=ar] .welcome h1{font-family:"Noto Kufi Arabic",sans-serif;font-weight:800;font-size:34px;line-height:1.3}
html[lang=ar] h2,html[lang=ar] .block h3,html[lang=ar] .ticket .day,html[lang=ar] .next .v{font-family:"Noto Kufi Arabic",sans-serif;font-weight:800;letter-spacing:0}
html[lang=ar] h2{font-size:30px;line-height:1.35}
html[lang=ar] .next .v{font-size:28px}
html[lang=ar] .block h3{font-size:21px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;margin-top:8px}
.stat.p{background:var(--orsoft);color:var(--or2)}
.stat.c{background:var(--oksoft);color:var(--ok)}
.stat.x{background:var(--redsoft);color:var(--red)}
.stat.p::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--or);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
/* ---------- home background animation (barber cutting hair) ---------- */
.home{position:relative;isolation:isolate}
.home-bg{position:absolute;z-index:-1;top:calc(56px + var(--safe-t));inset-inline-end:-4px;width:min(46%,230px);opacity:.14;pointer-events:none}
.home-bg svg{display:block;width:100%;height:auto;overflow:visible}
html[dir=rtl] .home-bg svg{transform:scaleX(-1)}
.home-bg .hb-arm{transform-box:view-box;transform-origin:160px 98px;animation:hbArm 1.4s ease-in-out infinite alternate}
.home-bg .hb-hair path{animation:hbHair 2.4s ease-in infinite;opacity:0}
.home-bg .hb-hair path:nth-child(2){animation-delay:.6s}
.home-bg .hb-hair path:nth-child(3){animation-delay:1.2s}
.home-bg .hb-hair path:nth-child(4){animation-delay:1.8s}
.home-bg .hb-b1{transform-box:view-box;transform-origin:38px 50px;animation:hbSnip1 1.8s ease-in-out infinite}
.home-bg .hb-b2{transform-box:view-box;transform-origin:38px 50px;animation:hbSnip2 1.8s ease-in-out infinite}
.home-bg .hb-sc{transform-box:view-box;transform-origin:38px 40px;animation:hbFloat 4s ease-in-out infinite}
@keyframes hbArm{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}
@keyframes hbHair{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(6px,70px) rotate(40deg)}}

}

const fromIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(body){
  const r = await fetch(CONFIG.apiUrl, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(body) });
  return r.json();
}
async function cancelBooking(id, phone){
  if (DEMO){
    const last = store.get("ob_last", null);
    if (last && last.id === id){ store.set(demoKey, store.get(demoKey, []).filter(b => !(b.date === last.date && b.start === last.start && b.barber === last.barber))); return { ok:true }; }
    return { ok:false, error:"notfound" };
  }
  return api({ action:"cancel", id, phone });
}
async function waitlist(p){ if (DEMO) return { ok:true }; return api({ action:"waitlist", ...p }); }
async function loyalty(phone){
  if (DEMO) return { ok:true, visits: 0 };
  const r = await fetch(CONFIG.apiUrl + "?action=loyalty&phone=" + encodeURIComponent(phone), { cache:"no-store" });
  return r.json();
}
async function fetchDay(date){
  if (st.bookings[date] && Date.now() - st.bookings[date].t < 30000) return st.bookings[date].list;
  let list;
  if (DEMO) list = store.get(demoKey, []).filter(b => b.date === date);
  else {
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 12000);
    const r = await fetch(CONFIG.apiUrl + "?date=" + date, { cache:"no-store", signal: ctrl.signal });
    clearTimeout(to);
    const j = await r.json();
    if (!j.ok) throw new Error("api");
    list = j.bookings;
  }
  st.bookings[date] = { t: Date.now(), list };
  return list;
}
async function book(p){
  if (DEMO){
    const all = store.get(demoKey, []), day = all.filter(b => b.date === p.date);
    const barber = p.candidates.find(c => !overlaps(day, c, p.start, p.dur));
    if (!barber) return { ok:false, error:"taken" };
    all.push({ date:p.date, start:p.start, dur:p.dur, barber }); store.set(demoKey, all);
    return { ok:true, barber, id: Math.random().toString(36).slice(2,10).toUpperCase(), statut: "en attente" };
  }
  const r = await fetch(CONFIG.apiUrl, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(p) });
  return r.json();
}

function shade(hex, amt){ const n = parseInt(hex.slice(1), 16); const f = v => Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt);
  return "#" + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(x => x.toString(16).padStart(2, "0")).join(""); }

function worksAt(name, date, m, dur){
  const c = member(name); if (!c) return false;
  const d = fromIso(date), h = hoursFor(d); if (!h) return false;
  if ((c.repos || []).includes(DAYKEYS[d.getDay()])) return false;
  const de = Math.max(toMin(h[0]), c.de ? toMin(c.de) : 0), a = Math.min(toMin(h[1]), c.a ? toMin(c.a) : 1440);
  return m >= de && m + dur <= a;
}

    if (!j.ok || !Array.isArray(j.coiffeurs) || !j.coiffeurs.length) return;
    TEAM = j.coiffeurs; GALLERY = j.galerie || [];
    if (Array.isArray(j.services) && j.services.length) SERVICES = j.services;
    if (j.salon){ SALON = j.salon; applySalon(); renderStatic(); if (st.step === 3) renderDays(); if (st.step === 4) loadSlots(); }
    st.services = st.services.filter(id => SERVICES.some(s => s.id === id));

function promoFor(date, m){
  const day = DAYKEYS[fromIso(date).getDay()];
  const p = (CONFIG.promos || []).find(x => (x.jours || []).includes(day) && m >= toMin(x.de) && m < toMin(x.a));
  return p ? p.pct : 0;
}
const promoPct = () => (st.date && st.start !== null) ? promoFor(st.date, st.start) : 0;
const promoAmount = () => Math.round(total() * promoPct() / 100);
function loyalAmount(){
  const f = CONFIG.fidelite; if (!f || !f.visites || st.loyal == null) return 0;
  return (st.loyal + 1) % f.visites === 0 ? Math.min(f.remise, total() - promoAmount()) : 0;

const finalTotal = () => Math.max(0, total() - promoAmount() - loyalAmount());
function slotsFor(date, list, dur, cands){
  const d = fromIso(date), h = hoursFor(d); if (!h) return [];
  const isToday = date === todayIso(), min = nowMin() + CONFIG.delaiMin, out = [];
  for (let m = toMin(h[0]); m + dur <= toMin(h[1]); m += CONFIG.creneau){
    const past = isToday && m < min;
    out.push({ m, free: !past && cands.some(c => worksAt(c, date, m, dur) && !overlaps(list, c, m, dur)) });
  }
  return out;
}

function show(n, opts = {}){

  st.step = n; if (n >= 1 && n <= 5) st.maxStep = Math.max(st.maxStep, n);

  if (!armed(btn, t("cancelConfirm"))) return;
  btn.disabled = true;
  try { const r = await cancelBooking(id, phone); $("#mMsg").innerHTML = cancelMsg(r) + (r.ok ? `<button class="cta block-btn" type="button" data-go="1" style="margin-top:14px">${t("rebook")}</button>` : "");
    if (r.ok){ forgetLast(id); st.bookings = {}; heroNext(); } else { btn.disabled = false; btn.classList.remove("armed"); btn.textContent = t("cancelConfirm"); }
  } catch(err){ $("#mMsg").innerHTML = cancelMsg({ ok:false }); btn.disabled = false; }
});

/* ---------- statut dyal réservation ---------- */
function statPill(s){
  s = String(s || "");
  if (s.includes("attente")) return `<span class="stat p">${t("stPending")}</span>`;
  if (s.startsWith("annul")) return `<span class="stat x">${t("stRefused")}</span>`;
  if (s) return `<span class="stat c">${t("stConfirmed")}</span>`;
  return "";
}
async function refreshStatus(l){
  if (DEMO) return;
  try {
    const r = await fetch(CONFIG.apiUrl + "?action=status&id=" + encodeURIComponent(l.id) + "&phone=" + encodeURIComponent(l.phone), { cache:"no-store" }).then(x => x.json());
    if (!r.ok) return;
    l.statut = r.statut; if (l.tk) l.tk.statut = r.statut; store.set("ob_last", l);
    if ($("#homeStat")) $("#homeStat").innerHTML = statPill(r.statut);
    if (String(r.statut).startsWith("annul") && $("#homeCancel")) $("#homeCancel").remove();
  } catch(e){}
}

/* ---------- accueil: rendez-vous jay / avis ---------- */
function renderHomeCards(){
  const box = $("#homeCards"), l = store.get("ob_last", null);
  if (!l){ box.innerHTML = ""; return; }
  const end = l.start + l.dur, upcoming = l.date > todayIso() || (l.date === todayIso() && end > nowMin());
  if (upcoming){
    box.innerHTML = `<div class="card"><div class="k">${t("upcomingT")}</div>
      <div class="v">${esc(relDay(l.date))} ${num(hhmm(l.start))} · ${esc(l.barber)}</div>
      <div class="s">${esc(l.services)} · ${num("#" + esc(l.id))}</div>
      <div id="homeStat">${statPill(l.statut)}</div>
      <div class="acts2">${l.tk ? `<button class="btn ghost" type="button" id="homeTicket">🎟️ ${t("tkView")}</button>` : ""}<button class="btn danger" type="button" id="homeCancel">${t("cancelBtn")}</button></div><div id="homeMsg"></div></div>`;
    if (l.tk && $("#homeTicket")) $("#homeTicket").onclick = () => { const s = store.get("ob_last", null); if (s && s.tk){ s.tk.statut = s.statut || s.tk.statut; showTicket(false, s.tk); } };
    refreshStatus(l);
    $("#homeCancel").onclick = async e => {
      const btn = e.currentTarget; if (!armed(btn, t("cancelBtn"))) return;
      btn.disabled = true;
      try { const r = await cancelBooking(l.id, l.phone); $("#homeMsg").innerHTML = cancelMsg(r);
        if (r.ok){ forgetLast(l.id); btn.remove(); st.bookings = {}; heroNext(); } else btn.disabled = false;
      } catch(err){ $("#homeMsg").innerHTML = cancelMsg({ ok:false }); btn.disabled = false; }
    };
  } else if (CONFIG.avisGoogle && !l.reviewed){
    box.innerHTML = `<div class="card"><div class="v">${t("reviewT")}</div><div class="s">${esc(l.services)} · ${esc(l.barber)}</div>
      <div class="acts2"><a class="btn ghost" id="reviewBtn" href="${esc(CONFIG.avisGoogle)}" target="_blank" rel="noopener">⭐ ${t("reviewB")}</a></div></div>`;
    $("#reviewBtn").onclick = () => { l.reviewed = true; store.set("ob_last", l); setTimeout(renderHomeCards, 500); };
  } else box.innerHTML = "";
}
function renderGallery(){
  if (!$("#galBlock")) return;
  const g = GALLERY || [];
  $("#galBlock").hidden = !g.length;
  $("#gal").innerHTML = g.map((src, i) => `<img src="${esc(src)}" alt="${esc(CONFIG.salon)} ${i+1}" loading="lazy" decoding="async" referrerpolicy="no-referrer">`).join("");
}

/* ---------- Pixel Meta ---------- */
function track(ev, data){ try { if (window.fbq) fbq("track", ev, data || {}); } catch(e){} }
if (CONFIG.metaPixelId){
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,"script","https://connect.facebook.net/en_US/fbevents.js");
  fbq("init", CONFIG.metaPixelId); fbq("track", "PageView");
}

/* ---------- PWA ---------- */
if ("serviceWorker" in navigator && location.protocol === "https:") window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

/* ---------- init ---------- */
document.documentElement.lang = lang === "ar" ? "ar" : "fr";
document.documentElement.dir = T().dir;
renderStatic(); renderGallery(); renderTeamStrip();
try { history.replaceState({ s:0 }, ""); } catch(e){}
show(0, { noFocus:true });
heroNext();
loadConfig();
})();
</script>
