<style>
:root{
  --leather:#0F1F19; --leather-2:#16291F; --leather-3:#1E3529; --line:#2A4436;
  --brass:#C9A35A; --brass-2:#E2C07C; --paper:#F2E9D8; --ink:#1A1A16;
  --cream:#EDE6D6; --mute:#9DAA9F; --pole:#B83A2E; --ok:#4FBF7F; --wa:#25D366;
  --display:"Big Shoulders Display", Impact, sans-serif;
  --body:"Instrument Sans", system-ui, sans-serif;
  --r-s:10px; --r-m:16px; --r-l:24px;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--leather);color:var(--cream);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass-2);outline-offset:3px;border-radius:6px}
h2:focus,h1:focus{outline:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- app shell ---------- */
.app{position:relative;max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--leather);overflow-x:clip}
html,body{overflow-x:hidden}
@media(min-width:720px){
  body{background:radial-gradient(ellipse at 20% 0%,#1B3327 0,transparent 60%),#0A1511;padding:32px 0}
  .app{min-height:calc(100vh - 64px);border-radius:28px;border:1px solid var(--line);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
}
.screen{display:none;flex:1;flex-direction:column;padding:8px 22px 130px}
.screen.on{display:flex;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes inback{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.screen.back-anim.on{animation-name:inback}
html[dir=rtl] .screen.on{animation-name:inback}
html[dir=rtl] .screen.back-anim.on{animation-name:in}

/* ---------- top bar (booking) ---------- */
.top{position:sticky;top:0;z-index:15;background:rgba(15,31,25,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(12px + var(--safe-t)) 22px 14px}
.top[hidden]{display:none}
.top .row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.back{width:42px;height:42px;border-radius:50%;background:var(--leather-3);display:grid;place-items:center;flex:0 0 42px}
.back:hover{background:#264233}
html[dir=rtl] .back svg{transform:scaleX(-1)}
.count{flex:1;min-width:0;font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count b{color:var(--cream);font-weight:600}
.mini{display:none;font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass)}
@media(min-width:440px){.mini{display:block}}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;list-style:none}
.steps li{height:4px;border-radius:4px;background:var(--line);transition:background .3s}
.steps li.on{background:var(--brass)}

h2{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--paper);letter-spacing:.3px;margin-top:10px}
.sub{color:var(--mute);font-size:15px;margin:8px 0 22px}

/* ---------- home ---------- */
.home{padding-top:calc(22px + var(--safe-t))}
.homehead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lang{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--leather-2);border:1px solid var(--line)}
.lang button{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mute);min-height:34px}
.lang button[aria-pressed=true]{background:var(--brass);color:var(--ink)}
.lang button[lang=ar]{font-family:"Noto Kufi Arabic",sans-serif}
.pole{width:10px;height:74px;border-radius:6px;flex:0 0 10px;
  background:repeating-linear-gradient(-45deg,var(--pole) 0 7px,var(--paper) 7px 14px,#2B4A8A 14px 21px,var(--paper) 21px 28px);
  background-size:100% 40px;animation:pole 2.4s linear infinite;box-shadow:0 0 0 3px var(--leather-3),0 0 0 4px var(--line)}
@keyframes pole{to{background-position:0 40px}}
.sign{font-family:var(--display);font-weight:900;line-height:.86;letter-spacing:.5px;text-transform:uppercase;color:var(--paper);font-size:clamp(58px,19vw,120px);margin-top:26px}
.sign small{display:block;font-size:.4em;letter-spacing:.2em;color:var(--brass);font-weight:800;margin-top:10px}
.where{margin-top:14px;color:var(--mute);font-size:15px}
.next{margin-top:28px;background:var(--leather-2);border:1px solid var(--line);border-radius:var(--r-l);padding:20px}
.next .k{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:8px}
.next .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:0 0 9px;animation:ping 2s infinite}
.next.closed .dot{background:var(--pole);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(79,191,127,.6)}70%{box-shadow:0 0 0 9px rgba(79,191,127,0)}100%{box-shadow:0 0 0 0 rgba(79,191,127,0)}}
.next .v{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.05;color:var(--paper);margin:6px 0 16px}
.next .v.load{color:var(--line)}
.block{margin-top:32px}
.block h3{font-family:var(--display);font-weight:800;font-size:26px;color:var(--paper);margin-bottom:8px;letter-spacing:.3px}
.hours{list-style:none}
.hours li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);color:var(--mute);font-size:15px}
.hours li.today{color:var(--paper);font-weight:600}
.contact{display:grid;gap:10px}
.contact a{display:flex;align-items:center;gap:12px;padding:15px 16px;background:var(--leather-2);border:1px solid var(--line);border-radius:var(--r-m);text-decoration:none;font-weight:600}
.contact a:hover{border-color:#3C5848}
.contact a span{color:var(--mute);font-weight:400;font-size:14px;margin-inline-start:auto}
.demo{margin-top:16px;padding:10px 12px;border-radius:var(--r-s);background:#3A2F17;color:var(--brass-2);font-size:13px}

/* ---------- buttons ---------- */
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brass);color:var(--ink);font-weight:700;border-radius:999px;padding:16px 24px;font-size:16px;text-decoration:none;transition:background .15s,transform .1s;white-space:nowrap;min-height:54px}
.cta:hover{background:var(--brass-2)}
.cta:active{transform:scale(.97)}
.cta:disabled{opacity:.35;cursor:not-allowed}
.cta.block-btn{width:100%}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;transition:transform .1s,background .15s;min-height:54px}
.btn:active{transform:scale(.98)}
.btn.wa{background:var(--wa);color:#06280F}
.btn.ghost{background:var(--leather-3);color:var(--cream)}
.btn.ghost:hover{background:#264233}
.link{color:var(--brass-2);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ---------- services ---------- */
.svc{display:grid;gap:10px}
.svc button{display:grid;grid-template-columns:1fr auto 26px;align-items:center;gap:14px;text-align:start;padding:16px 16px 16px 18px;border-radius:var(--r-m);background:var(--leather-3);border:1.5px solid transparent;transition:border-color .15s,background .15s;min-height:76px}
.svc button:hover{border-color:var(--line)}
.svc button[aria-pressed=true]{border-color:var(--brass);background:#283B26}
.svc .n{font-weight:600;font-size:17px;color:var(--paper);display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.svc .d{font-size:13px;color:var(--mute);margin-top:2px}
.svc .p{text-align:end}
.svc .p b{display:block;font-family:var(--display);font-weight:800;font-size:24px;color:var(--brass-2);line-height:1}
.svc .p span{font-size:12px;color:var(--mute)}
.tag{font-size:11px;font-weight:600;color:var(--ink);background:var(--brass);padding:2px 8px;border-radius:99px}
.box{width:26px;height:26px;border-radius:8px;border:1.5px solid #4A6455;display:grid;place-items:center;transition:.15s}
.box svg{opacity:0;transform:scale(.6);transition:.15s}
[aria-pressed=true] .box,[aria-checked=true] .box{background:var(--brass);border-color:var(--brass)}
[aria-pressed=true] .box svg,[aria-checked=true] .box svg{opacity:1;transform:none}

/* ---------- team ---------- */
.team{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.team button{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:22px 10px 18px;border-radius:var(--r-m);background:var(--leather-3);border:1.5px solid transparent;transition:border-color .15s}
.team button:hover{border-color:var(--line)}
.team button[aria-checked=true]{border-color:var(--brass);background:#283B26}
.team .any{grid-column:1/-1;flex-direction:row;text-align:start;padding:16px 18px;gap:14px}
.team .any .tx{flex:1}
.av{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:32px;color:var(--ink);background:var(--brass)}
.any .av{width:50px;height:50px;font-size:22px;background:var(--leather);color:var(--brass);border:1.5px dashed var(--brass)}
.team .n{font-weight:600;color:var(--paper);font-size:16px}
.team .d{font-size:13px;color:var(--mute)}

/* ---------- days ---------- */
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:420px){.days{grid-template-columns:repeat(5,1fr)}}
.days button{padding:12px 0 10px;border-radius:var(--r-m);background:var(--leather-3);border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:84px;justify-content:center}
.days button:hover:not(:disabled){border-color:var(--line)}
.days button[aria-checked=true]{background:var(--brass);color:var(--ink)}
.days button[aria-checked=true] .w,.days button[aria-checked=true] .m{color:var(--ink)}
.days button:disabled{opacity:.28;cursor:not-allowed}
.days .w{font-size:12px;color:var(--mute);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.days .n{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05}
.days .m{font-size:11px;color:var(--mute)}
.weeklabel{font-size:13px;color:var(--mute);margin:18px 0 8px}
.weeklabel:first-child{margin-top:0}

/* ---------- times ---------- */
.daychip{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--leather-2);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 16px;margin-bottom:6px}
.daychip b{color:var(--paper);font-weight:600}
.daychip span{font-size:13px;color:var(--mute);display:block}
.daychip button{color:var(--brass-2);font-weight:600;font-size:14px}
.period{font-size:13px;color:var(--mute);margin:18px 0 8px}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.times button{padding:14px 0;border-radius:var(--r-s);background:var(--leather-3);font-weight:600;font-size:15px;border:1.5px solid transparent;font-variant-numeric:tabular-nums;min-height:50px}
.times button:hover:not(:disabled){border-color:var(--line)}
.times button[aria-checked=true]{background:var(--brass);color:var(--ink)}
.times button:disabled{opacity:.22;text-decoration:line-through;cursor:not-allowed}
.times button.best:not([aria-checked=true]){border-color:rgba(201,163,90,.55)}
.skel{height:50px;border-radius:var(--r-s);background:linear-gradient(90deg,var(--leather-3),#253F31,var(--leather-3));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.note{background:var(--leather-3);border-radius:var(--r-m);padding:24px;text-align:center;color:var(--mute);font-size:15px;margin-top:14px}
.note .cta{margin-top:14px}
.note .link{display:inline-block;margin-top:10px}

/* ---------- infos ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-size:14px;font-weight:600;color:var(--paper);margin-bottom:7px}
.field input{width:100%;background:var(--leather-2);border:1.5px solid var(--line);border-radius:var(--r-m);padding:16px;font-size:17px;transition:border-color .15s;min-height:56px}
.field input:focus{outline:none;border-color:var(--brass)}
.field input[aria-invalid=true]{border-color:var(--pole)}
.field .help{font-size:13px;color:var(--mute);margin-top:6px}
.field .help.err{color:#F08A7E}
.recap{border:1px dashed #3C5848;border-radius:var(--r-m);padding:4px 16px;margin-bottom:22px}
.recap div{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px dashed #3C5848;font-size:15px}
.recap div:last-child{border:0}
.recap span{color:var(--mute)}
.recap b{font-weight:600;color:var(--paper);text-align:end}
.recap .tot b{font-family:var(--display);font-weight:800;font-size:26px;color:var(--brass-2)}
.recap button{color:var(--brass-2);font-size:13px;font-weight:600;margin-inline-start:8px;padding:4px 0}
.formerr{color:#F08A7E;font-size:14px;text-align:center;min-height:20px;margin-top:4px}

/* ---------- action bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(15,31,25,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 22px calc(12px + var(--safe-b))}
.bar[hidden]{display:none}
.bar .in{max-width:516px;margin:0 auto;display:flex;align-items:center;gap:14px}
@media(min-width:720px){.bar{position:sticky;bottom:0;margin-top:auto}}
.bar .sum{flex:1;min-width:0;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sum b{display:block;font-family:var(--display);font-weight:800;font-size:26px;color:var(--paper);line-height:1.05}
.bar .cta{min-width:150px}
.spin{width:18px;height:18px;border:2px solid rgba(26,26,22,.3);border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- ticket ---------- */
.done{text-align:center;padding-top:calc(30px + var(--safe-t))}
.ticket{position:relative;background:var(--paper);color:var(--ink);border-radius:14px;margin:20px auto 24px;width:100%;max-width:360px;text-align:start;animation:print .6s cubic-bezier(.2,.8,.2,1)}
@keyframes print{from{transform:translateY(-24px);opacity:0;clip-path:inset(0 0 100% 0)}to{transform:none;opacity:1;clip-path:inset(0 0 0 0)}}
.ticket .tp{padding:20px 22px 16px;text-align:center}
.ticket .brand{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.06em;text-transform:uppercase}
.ticket .addr{font-size:12px;color:#6B6455}
.ticket .when{font-family:var(--display);font-weight:900;font-size:60px;line-height:.9;margin:14px 0 4px}
.ticket .day{font-weight:600;font-size:16px}
.ticket .tear{position:relative;height:0;border-top:2px dashed #C9BC9F;margin:0 18px}
.ticket .tear::before,.ticket .tear::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--leather)}
.ticket .tear::before{left:-30px}.ticket .tear::after{right:-30px}
.ticket dl{padding:14px 22px 6px;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.ticket dt{color:#6B6455}
.ticket dd{text-align:end;font-weight:600}
.ticket .ref{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 18px;font-size:13px;color:#6B6455}
.ticket .ref b{font-family:var(--display);font-weight:800;font-size:20px;color:var(--ink);letter-spacing:.08em}
.barcode{height:34px;margin:0 22px 18px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px);opacity:.85;border-radius:2px}
.acts{display:grid;gap:10px;width:100%;max-width:360px;margin:0 auto}
.small{font-size:13px;color:var(--mute);margin-top:16px}
.small a{color:var(--brass-2)}

/* ---------- arabic ---------- */
html[lang=ar] body{font-family:"Noto Kufi Arabic","Instrument Sans",sans-serif;line-height:1.7}
html[lang=ar] h2,html[lang=ar] .block h3,html[lang=ar] .ticket .day,html[lang=ar] .next .v{font-family:"Noto Kufi Arabic",sans-serif;font-weight:800;letter-spacing:0}
html[lang=ar] h2{font-size:30px;line-height:1.35}
html[lang=ar] .next .v{font-size:28px}
html[lang=ar] .block h3{font-size:21px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ============ 0. ACCUEIL ============ -->
  <section class="screen home on" id="s0" aria-labelledby="sign">
    <div class="homehead">
      <div class="lang" role="group" aria-label="Langue / اللغة">
        <button type="button" data-lang="da" lang="fr">Darija</button>

const $ = s => document.querySelector(s);
const DAYKEYS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const ANY = "__any__";
const CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1A1A16" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

const store = {
  get(k, f){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch(e){ return f; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ---------- langue ---------- */
function pickLang(){
  const saved = store.get("ob_lang", null);
  if (I18N[saved]) return saved;
  const nav = (navigator.language || "").slice(0,2);
  if (nav === "ar") return "ar";
  return I18N[CONFIG.langueParDefaut] ? CONFIG.langueParDefaut : "da";
}
let lang = pickLang();
const T = () => I18N[lang];
const t = (k, vars) => { let s = T()[k]; if (typeof s !== "string") return s; if (vars) for (const v in vars) s = s.replace("{"+v+"}", vars[v]); return s; };
const L = v => v == null ? "" : typeof v === "string" ? v : (v[lang] || v.fr || v.da || Object.values(v)[0]);
const Lfr = v => typeof v === "string" ? v : (v.fr || v.da || Object.values(v)[0]);   // smiya li katsjjel f Sheet
const num = s => `<span class="num">${s}</span>`;

const pad = n => String(n).padStart(2,"0");
const toMin = s => { const [h,m] = s.split(":").map(Number); return h*60+m; };
const hhmm = m => pad(Math.floor(m/60)) + ":" + pad(m%60);
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hoursFor = d => CONFIG.horaires[DAYKEYS[d.getDay()]];
const nowMin = () => { const n = new Date(); return n.getHours()*60 + n.getMinutes(); };
const todayIso = () => iso(new Date());
const relDay = s => { if (s === todayIso()) return t("today"); const tm = new Date(); tm.setDate(tm.getDate()+1); return s === iso(tm) ? t("tomorrow") : T().days[fromIso(s).getDay()]; };
const longDate = s => { const d = fromIso(s); return T().days[d.getDay()] + " " + d.getDate() + " " + T().months[d.getMonth()]; };
const price = n => lang === "ar" ? n + " " + t("dh") : n + " DH";
const mins = n => n + " " + t("min");

const DEMO = !CONFIG.apiUrl;
const st = { step:1, maxStep:1, services:[], barber:ANY, date:null, start:null, bookings:{}, result:null, next:null };

/* ---------- data ---------- */
const demoKey = "ob_demo";
const overlaps = (list, b, s, d) => list.some(x => x.barber === b && s < x.start + x.dur && x.start < s + d);
async function fetchDay(date){
  if (st.bookings[date] && Date.now() - st.bookings[date].t < 30000) return st.bookings[date].list;
  let list;
  if (DEMO) list = store.get(demoKey, []).filter(b => b.date === date);
  else {
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 12000);
    const r = await fetch(CONFIG.apiUrl + "?date=" + date, { cache:"no-store", signal: ctrl.signal });
    clearTimeout(to);
    const j = await r.json();
    if (!j.ok) throw new Error("api");
    list = j.bookings;
  }
  st.bookings[date] = { t: Date.now(), list };
  return list;
}
async function book(p){
  if (DEMO){
    const all = store.get(demoKey, []), day = all.filter(b => b.date === p.date);
    const barber = p.candidates.find(c => !overlaps(day, c, p.start, p.dur));
    if (!barber) return { ok:false, error:"taken" };
    all.push({ date:p.date, start:p.start, dur:p.dur, barber }); store.set(demoKey, all);
    return { ok:true, barber, id: Math.random().toString(36).slice(2,10).toUpperCase() };
  }
  const r = await fetch(CONFIG.apiUrl, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(p) });
  return r.json();
}

/* ---------- derived ---------- */
const chosen = () => st.services.map(i => CONFIG.services[i]);
const svcNames = () => chosen().map(s => L(s.nom)).join(" + ");
const total = () => chosen().reduce((a,s) => a + s.prix, 0);
const duration = () => chosen().reduce((a,s) => a + s.duree, 0) || CONFIG.creneau;
const candidates = () => st.barber === ANY ? CONFIG.coiffeurs.slice() : [st.barber];
function slotsFor(date, list, dur, cands){
  const d = fromIso(date), h = hoursFor(d); if (!h) return [];
  const isToday = date === todayIso(), min = nowMin() + CONFIG.delaiMin, out = [];
  for (let m = toMin(h[0]); m + dur <= toMin(h[1]); m += CONFIG.creneau){
    const past = isToday && m < min;
    out.push({ m, free: !past && cands.some(c => !overlaps(list, c, m, dur)) });
  }
  return out;
}

/* ---------- static UI ---------- */
function renderStatic(){
  const parts = CONFIG.salon.trim().split(/\s+/);
  $("#sign").innerHTML = esc(parts[0]) + (parts.length > 1 ? "<small>" + esc(parts.slice(1).join(" ")) + "</small>" : "");
  $("#mini").textContent = CONFIG.salon;
  document.title = CONFIG.salon + " · " + t("title");
  $("#where").textContent = "📍 " + CONFIG.adresse;
  $("#demo").hidden = !DEMO;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  $("#backBtn").setAttribute("aria-label", t("back"));
  $("#name").placeholder = t("namePh");
  $("#phoneHelp").className = "help"; $("#phoneHelp").textContent = t("phoneHelp");
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));

  const today = new Date().getDay(), order = [1,2,3,4,5,6,0];
  const allSame = order.every(d => JSON.stringify(CONFIG.horaires[DAYKEYS[d]]) === JSON.stringify(CONFIG.horaires.lundi));
  $("#hours").innerHTML = allSame && CONFIG.horaires.lundi
    ? `<li><span>${t("everyDay")}</span><span>${num(CONFIG.horaires.lundi.join(" – "))}</span></li>`
    : order.map(d => { const h = CONFIG.horaires[DAYKEYS[d]];
        return `<li class="${d===today?"today":""}"><span>${T().days[d]}${d===today?" · "+esc(t("todayTag")):""}</span><span>${h ? num(h.join(" – ")) : t("dayOff")}</span></li>`; }).join("");
  const wa = "https://wa.me/" + CONFIG.whatsapp;
  $("#contact").innerHTML =
    `<a href="${esc(CONFIG.mapsUrl)}" target="_blank" rel="noopener">📍 ${esc(CONFIG.adresse)}<span>${t("cMaps")}</span></a>
     <a href="tel:+${esc(CONFIG.whatsapp)}">📞 ${num(esc(CONFIG.telAffiche))}<span>${t("cCall")}</span></a>
     <a href="${wa}" target="_blank" rel="noopener">💬 WhatsApp<span>${t("cWa")}</span></a>` +
    (CONFIG.instagram ? `<a href="https://instagram.com/${esc(CONFIG.instagram)}" target="_blank" rel="noopener">📸 ${num("@" + esc(CONFIG.instagram))}<span>Instagram</span></a>` : "");
  $("#waChange").href = wa;
}

function setLang(l){
  if (!I18N[l]) return;
  lang = l; store.set("ob_lang", l);
  document.documentElement.lang = l === "ar" ? "ar" : "fr";
  document.documentElement.dir = T().dir;
  renderStatic(); renderHeroNext();
  if (st.step === 6) showTicket(true); else show(st.step, { noFocus:true });
}
document.querySelector(".lang").addEventListener("click", e => { const b = e.target.closest("button[data-lang]"); if (b) setLang(b.dataset.lang); });

/* ---------- accueil: akrab blassa ---------- */
function renderHeroNext(){
  const el = $("#nextBox"), v = $("#nextV"), k = $("#nextK"), n = st.next;
  if (!n){ k.textContent = t("nextDefault"); return; }
  v.classList.remove("load");
  if (n.type === "slot"){
    v.innerHTML = esc(relDay(n.date)) + " " + num(hhmm(n.m));
    const h = hoursFor(new Date()), m = nowMin(), open = h && m >= toMin(h[0]) && m < toMin(h[1]);
    el.classList.toggle("closed", !open);
    k.textContent = open ? t("nextOpen") : t("nextClosed");
  } else if (n.type === "full"){ v.textContent = t("nextFull"); k.textContent = t("nextDefault"); }
  else { v.textContent = t("nextFallback"); k.textContent = CONFIG.salon; }
}
async function heroNext(){
  try {
    for (let i = 0; i < 7; i++){
      const d = new Date(); d.setDate(d.getDate()+i);
      if (!hoursFor(d)) continue;
      const date = iso(d), list = await fetchDay(date);
      const s = slotsFor(date, list, CONFIG.creneau, CONFIG.coiffeurs).find(x => x.free);
      if (s){ st.next = { type:"slot", date, m:s.m }; renderHeroNext(); return; }
    }
    st.next = { type:"full" };
  } catch(e){ st.next = { type:"err" }; }
  renderHeroNext();
}

/* ---------- 1. service ---------- */
function renderServices(){
  $("#services").innerHTML = CONFIG.services.map((s,i) => `
    <button type="button" aria-pressed="${st.services.includes(i)}" data-i="${i}">
      <div><div class="n">${esc(L(s.nom))}${s.top ? `<span class="tag">${t("top")}</span>` : ""}</div><div class="d">${esc(L(s.desc))}</div></div>
      <div class="p"><b>${price(s.prix)}</b><span>${mins(s.duree)}</span></div>
      <div class="box">${CHECK}</div>
    </button>`).join("");
}
$("#services").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const i = +b.dataset.i;
  st.services = st.services.includes(i) ? st.services.filter(x => x !== i) : [...st.services, i];
  st.start = null; st.maxStep = Math.min(st.maxStep, st.services.length ? 2 : 1);
  b.setAttribute("aria-pressed", st.services.includes(i)); update();
});

/* ---------- 2. coiffeur ---------- */
function renderTeam(){
  const any = `<button type="button" role="radio" class="any" aria-checked="${st.barber===ANY}" data-id="${ANY}">
      <div class="av" aria-hidden="true">?</div>
      <div class="tx"><div class="n">${t("anyN")}</div><div class="d">${t("anyD")}</div></div>
      <div class="box">${CHECK}</div></button>`;
  $("#team").innerHTML = any + CONFIG.coiffeurs.map(c => `
    <button type="button" role="radio" aria-checked="${st.barber===c}" data-id="${esc(c)}">
      <div class="av" aria-hidden="true">${esc(c[0])}</div>
      <div><div class="n">${esc(c)}</div><div class="d">${t("barberRole")}</div></div>
    </button>`).join("");
}
$("#team").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  st.barber = b.dataset.id; st.start = null; renderTeam(); update();
  setTimeout(() => go(3), 220);
});

/* ---------- 3. nhar ---------- */
function renderDays(){
  const td = new Date(); td.setHours(0,0,0,0);
  const weeks = [[],[]];
  for (let i = 0; i < CONFIG.joursAffiches; i++){
    const d = new Date(td); d.setDate(td.getDate()+i);
    const h = hoursFor(d), di = iso(d);
    const late = i === 0 && h && nowMin() + CONFIG.delaiMin > toMin(h[1]) - duration();
    const off = !h || late;
    const w = i === 0 ? t("today") : i === 1 ? t("tomorrow") : T().daysShort[d.getDay()];
    weeks[i < 7 ? 0 : 1].push(`<button type="button" role="radio" aria-checked="${st.date===di}" data-d="${di}" ${off?"disabled":""} aria-label="${esc(longDate(di))}${off?" ("+t("closed")+")":""}">
      <span class="w">${esc(w)}</span><span class="n">${d.getDate()}</span><span class="m">${esc(T().monthsShort[d.getMonth()])}</span></button>`);
  }
  $("#s3sub").textContent = t("s3s");
  $("#days").innerHTML = weeks.filter(w => w.length).map((w, i) =>
    `<div class="weeklabel">${i === 0 ? t("thisWeek") : t("nextWeek")}</div><div class="days">${w.join("")}</div>`).join("");
  if (st.date && $(`#days [data-d="${st.date}"]`)?.disabled) st.date = null;
}
$("#days").addEventListener("click", e => {
  const b = e.target.closest("button[data-d]"); if (!b || b.disabled) return;
  if (st.date !== b.dataset.d) st.start = null;
  st.date = b.dataset.d;
  $("#days").querySelectorAll("button[data-d]").forEach(x => x.setAttribute("aria-checked", x === b));
  update(); fetchDay(st.date).catch(() => {});      // n-préchargiw les crénaux
  setTimeout(() => go(4), 220);
});

/* ---------- 4. sa3a ---------- */
let seq = 0;
async function loadSlots(){
  const my = ++seq, box = $("#slots");
  $("#s4sub").innerHTML = esc(svcNames()) + " · " + mins(duration()) + (st.barber === ANY ? "" : " " + t("with") + " " + esc(st.barber));
  const chip = `<div class="daychip"><div><span>${t("stepNames")[2]}</span><b>${esc(longDate(st.date))}</b></div><button type="button" data-go="3">${t("changeDay")}</button></div>`;
  const cached = st.bookings[st.date];
  if (cached && Date.now() - cached.t < 30000) return renderSlots(cached.list, chip);
  box.innerHTML = chip + `<div class="period">${t("loading")}</div><div class="times">${'<div class="skel"></div>'.repeat(12)}</div>`;
  try {
    const list = await fetchDay(st.date);
    if (my !== seq) return;
    renderSlots(list, chip);
  } catch(e){
    if (my !== seq) return;
    box.innerHTML = chip + `<div class="note">${t("loadErr")}<br><button class="cta" type="button" id="retry">${t("retry")}</button></div>`;
    $("#retry").onclick = () => { delete st.bookings[st.date]; loadSlots(); };
  }
}
function renderSlots(list, chip){
  const slots = slotsFor(st.date, list, duration(), candidates());
  const free = slots.filter(s => s.free);
  if (!free.length){
    $("#slots").innerHTML = chip + `<div class="note">${esc(t("full", { day: relDay(st.date) }))}<br><button type="button" class="link" data-go="3">${t("nextDay")}</button></div>`;
    return;
  }
  const groups = [["morning", s => s.m < 720], ["afternoon", s => s.m >= 720 && s.m < 1080], ["evening", s => s.m >= 1080]];
  const firstFree = free[0].m;
  $("#slots").innerHTML = chip + `<div class="period">${esc(t("freeCount", { n: free.length }))}</div>` +
    groups.map(([key, f]) => { const g = slots.filter(f); if (!g.length) return "";
      return `<div class="period">${t(key)}</div><div class="times" role="radiogroup" aria-label="${t(key)}" dir="ltr">` +
        g.map(s => `<button type="button" role="radio" data-m="${s.m}" aria-checked="${st.start===s.m}" ${s.free?"":"disabled"} class="${s.m===firstFree?"best":""}">${hhmm(s.m)}</button>`).join("") + "</div>";
    }).join("");
}
$("#slots").addEventListener("click", e => {
  const b = e.target.closest("button[data-m]"); if (!b || b.disabled) return;
  st.start = +b.dataset.m;
  $("#slots").querySelectorAll("button[data-m]").forEach(x => x.setAttribute("aria-checked", x === b));
  update();
});

/* ---------- 5. infos ---------- */
function recapHtml(){
  return `
    <div><span>${t("rService")}</span><b>${esc(svcNames())}<button type="button" data-go="1">${t("change")}</button></b></div>
    <div><span>${t("rBarber")}</span><b>${st.barber===ANY ? t("anyN") : esc(st.barber)}<button type="button" data-go="2">${t("change")}</button></b></div>
    <div><span>${t("rTime")}</span><b>${esc(relDay(st.date))} ${num(hhmm(st.start))}<button type="button" data-go="4">${t("change")}</button></b></div>
    <div class="tot"><span>${t("rTotal")}</span><b>${price(total())}</b></div>`;
}
const normPhone = v => v.replace(/[\s.\-()]/g,"").replace(/^00/, "+");
const phoneOk = () => /^(?:\+212|212|0)[5-7]\d{8}$/.test(normPhone($("#phone").value));
$("#phone").addEventListener("input", e => {
  const raw = e.target.value;
  if (/^0\d*$/.test(raw.replace(/\s/g,""))) { const d = raw.replace(/\D/g,"").slice(0,10); e.target.value = d.replace(/(\d{2})(?=\d)/g,"$1 "); }
  $("#phone").removeAttribute("aria-invalid"); $("#phoneHelp").className = "help"; $("#phoneHelp").textContent = t("phoneHelp");
  update();
});
$("#phone").addEventListener("blur", () => {
  if ($("#phone").value && !phoneOk()){ $("#phone").setAttribute("aria-invalid","true"); $("#phoneHelp").className = "help err"; $("#phoneHelp").textContent = t("phoneErr"); }
});
$("#name").addEventListener("input", update);

/* ---------- navigation ---------- */
// show = render l-écran; go = show + history (bouton "retour" dyal téléphone kaykhdem)
function show(n, opts = {}){
  const back = n < st.step;
  st.step = n; if (n >= 1 && n <= 5) st.maxStep = Math.max(st.maxStep, n);
  document.querySelectorAll(".screen").forEach(s => { s.classList.toggle("back-anim", back); s.classList.toggle("on", s.id === "s"+n); });
  const inFlow = n >= 1 && n <= 5;
  $("#top").hidden = !inFlow; $("#bar").hidden = !inFlow;
  if (inFlow){
    $("#count").innerHTML = `<b>${esc(t("stepNames")[n-1])}</b> · ${esc(t("stepCount", { n }))}`;
    document.querySelectorAll("#steps li").forEach((li, i) => li.classList.toggle("on", i < n));
  }
  if (n === 1) renderServices();
  if (n === 2) renderTeam();
  if (n === 3) renderDays();
  if (n === 4) loadSlots();
  if (n === 5){ $("#recap").innerHTML = recapHtml(); $("#formErr").textContent = "";
    const me = store.get("ob_me", null);
    if (me && !$("#name").value){ $("#name").value = me.name || ""; $("#phone").value = me.phone || ""; } }
  update();
  window.scrollTo(0, 0);
  if (!opts.noFocus){ const h = n === 0 ? $("#sign") : $("#s"+n+" h2"); if (h){ h.setAttribute("tabindex","-1"); h.focus({ preventScroll:true }); } }
}
const canReach = n => n === 0 || n === 6 || (n === 1) || (n === 2 && st.services.length) || (n === 3 && st.services.length && st.barber) ||
  (n === 4 && st.date) || (n === 5 && st.start !== null);
function go(n){
  if (!canReach(n)) return;
  try { history.pushState({ s:n }, ""); } catch(e){}
  show(n);
}
window.addEventListener("popstate", e => {
  let n = e.state && typeof e.state.s === "number" ? e.state.s : 0;
  if (st.step === 6){ n = 0; resetFlow(); }       // mn ba3d l-ticket, retour = accueil
  while (n > 0 && !canReach(n)) n--;
  show(n);
});
$("#backBtn").addEventListener("click", () => history.length > 1 && history.state ? history.back() : show(Math.max(0, st.step - 1)));
document.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b && !b.disabled) go(+b.dataset.go); });

function update(){
  const n = st.step, c = chosen(), btn = $("#next");
  $("#sum").innerHTML = c.length ? `${esc(T().nServices(c.length))} · ${mins(duration())}<b>${price(total())}</b>` : t("pickFirst");
  const ready = { 1: c.length > 0, 2: !!st.barber, 3: !!st.date, 4: st.start !== null, 5: $("#name").value.trim().length > 1 && phoneOk() }[n];
  btn.disabled = !ready;
  btn.textContent = n === 5 ? t("confirm") : t("next");
}

$("#next").addEventListener("click", async () => {
  if (st.step < 5) return go(st.step + 1);
  const btn = $("#next");
  btn.disabled = true; btn.innerHTML = `<span class="spin" aria-hidden="true"></span>${t("saving")}`;
  const name = $("#name").value.trim(), phone = $("#phone").value.trim();
  const payload = { date: st.date, start: st.start, dur: duration(), candidates: candidates(),
    services: chosen().map(s => Lfr(s.nom)).join(" + "), price: total(), name, phone };
  try {
    const r = await book(payload);
    if (r.ok){
      store.set("ob_me", { name, phone });
      delete st.bookings[st.date];
      st.result = { ...r, name, phone }; showTicket(); heroNext(); return;
    }
    if (r.error === "taken"){
      $("#formErr").textContent = t("errTaken");
      delete st.bookings[st.date]; st.start = null;
      setTimeout(() => go(4), 1400);
    } else $("#formErr").textContent = t("errFail");
  } catch(e){ $("#formErr").textContent = t("errNet"); }
  update();
});

/* ---------- 6. ticket ---------- */
function icsData(){
  const d = fromIso(st.date), s = st.start, e = s + duration();
  const f = m => iso(d).replace(/-/g,"") + "T" + pad(Math.floor(m/60)) + pad(m%60) + "00";
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Oussama Barber//FR","BEGIN:VEVENT",
    "UID:" + st.result.id + "@oussama-barber", "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g,"").split(".")[0] + "Z",
    "DTSTART:" + f(s), "DTEND:" + f(e),
    "SUMMARY:" + CONFIG.salon + " – " + svcNames(),
    "LOCATION:" + CONFIG.adresse, "DESCRIPTION:" + t("tBarber") + ": " + st.result.barber + " · #" + st.result.id,
    "BEGIN:VALARM","TRIGGER:-PT1H","ACTION:DISPLAY","DESCRIPTION:" + t("calAlarm", { salon: CONFIG.salon }),"END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  return "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
}
function showTicket(stay){
  const r = st.result;
  $("#ticket").innerHTML = `
    <div class="tp">
      <div class="brand">${esc(CONFIG.salon)}</div>
      <div class="addr">${esc(CONFIG.adresse)}</div>
      <div class="when" dir="ltr">${hhmm(st.start)}</div>
      <div class="day">${esc(longDate(st.date))}</div>
    </div>
    <div class="tear" aria-hidden="true"></div>
    <dl>
      <dt>${t("tName")}</dt><dd>${esc(r.name)}</dd>
      <dt>${t("tBarber")}</dt><dd>${esc(r.barber)}</dd>
      <dt>${t("tService")}</dt><dd>${esc(svcNames())}</dd>
      <dt>${t("tDur")}</dt><dd>${mins(duration())}</dd>
      <dt>${t("tTotal")}</dt><dd>${price(total())}</dd>
    </dl>
    <div class="ref"><span>${t("tRef")}</span><b dir="ltr">#${esc(r.id)}</b></div>
    <div class="barcode" aria-hidden="true"></div>`;
  const msg = `${t("waMsg", { salon: CONFIG.salon })}
📅 ${longDate(st.date)} · ${hhmm(st.start)}
💈 ${r.barber}
✂️ ${svcNames()} (${price(total())})
🙍 ${r.name} · ${r.phone}
🔖 #${r.id}`;
  $("#waBtn").href = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(msg);
  $("#calBtn").href = icsData();
  if (stay !== true){ try { history.replaceState({ s:6 }, ""); } catch(e){} show(6); }
}
function resetFlow(){ Object.assign(st, { services:[], barber:ANY, date:null, start:null, result:null, maxStep:1 }); }
$("#again").addEventListener("click", () => { resetFlow(); go(1); });

/* ---------- init ---------- */
document.documentElement.lang = lang === "ar" ? "ar" : "fr";
document.documentElement.dir = T().dir;
renderStatic();
try { history.replaceState({ s:0 }, ""); } catch(e){}
show(0, { noFocus:true });
heroNext();
})();
</script>
</body>
</html>
