<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F1F19">
<title>Admin · Oussama Barber</title>
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* Nefs l-URL w les coiffeurs li f index.html */
const ADMIN = {
  apiUrl: "https://script.google.com/macros/s/AKfycbzBna68m3uYB009UEVxlTisv_vr2G3eAaMUGQg0eeThgE43x_TUKor1Frhb1s8a-8NmIQ/exec",
  coiffeurs: ["Oussama", "Yassine", "Aymane"]
};
</script>
<style>
:root{--bg:#0F1F19;--c2:#16291F;--c3:#1E3529;--line:#2A4436;--brass:#C9A35A;--brass2:#E2C07C;--paper:#F2E9D8;--ink:#1A1A16;--cream:#EDE6D6;--mute:#9DAA9F;--red:#B83A2E;--ok:#4FBF7F;--wa:#25D366;
  --display:"Big Shoulders Display",Impact,sans-serif;--body:"Instrument Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--cream);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brass2);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:10;background:rgba(15,31,25,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 0 12px}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:.04em;text-transform:uppercase;color:var(--paper)}
.brand small{color:var(--brass);font-size:15px;letter-spacing:.12em;margin-inline-start:6px}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--c3);display:grid;place-items:center}
h2{font-family:var(--display);font-weight:800;font-size:32px;color:var(--paper);margin:18px 0 10px;line-height:1}
.sub{color:var(--mute);font-size:14px;margin:-4px 0 14px}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:380px;margin:0 auto;text-align:center}
.login h1{font-family:var(--display);font-weight:900;font-size:56px;line-height:.9;text-transform:uppercase;color:var(--paper)}
.login h1 small{display:block;color:var(--brass);font-size:22px;letter-spacing:.2em;margin-top:8px}
.login p{color:var(--mute);margin:18px 0}
.pin{width:100%;text-align:center;letter-spacing:.5em;font-size:28px;padding:16px;border-radius:16px;background:var(--c2);border:1.5px solid var(--line)}
.pin:focus{outline:none;border-color:var(--brass)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:11px 18px;border-radius:999px;font-weight:700;background:var(--brass);color:var(--ink)}
.btn:disabled{opacity:.4}
.btn.full{width:100%;margin-top:12px;min-height:54px}
.btn.ghost{background:var(--c3);color:var(--cream)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px}
.err{color:#F08A7E;font-size:14px;min-height:20px;margin-top:10px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(15,31,25,.97);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:12px;font-size:12px;font-weight:600;color:var(--mute)}
nav.tabs button span{font-size:20px;line-height:1}
nav.tabs button[aria-selected=true]{color:var(--paper);background:var(--c3)}
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;margin-inline-start:3px}

/* date strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:var(--c3);font-weight:600;font-size:14px;white-space:nowrap}
.strip button[aria-pressed=true]{background:var(--brass);color:var(--ink)}
.strip input{flex:0 0 auto;background:var(--c3);border:0;border-radius:999px;padding:8px 12px;color-scheme:dark}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.summary div{background:var(--c2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.summary b{display:block;font-family:var(--display);font-weight:800;font-size:26px;color:var(--paper);line-height:1.1}
.summary span{font-size:12px;color:var(--mute)}

/* rdv cards */
.list{display:grid;gap:10px}
.rdv{background:var(--c2);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;display:grid;grid-template-columns:64px 1fr;gap:4px 12px}
.rdv .h{font-family:var(--display);font-weight:800;font-size:28px;color:var(--paper);line-height:1;grid-row:span 2}
.rdv .h small{display:block;font-family:var(--body);font-size:12px;color:var(--mute);font-weight:500;margin-top:4px}
.rdv .who{font-weight:700;color:var(--paper);font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rdv .what{color:var(--mute);font-size:14px}
.rdv .row{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--c3);color:var(--mute)}
.pill.confirmé{background:#22301F;color:var(--brass2)}
.pill.venu{background:#1F3A2B;color:#8FE0B2}
.pill.absent{background:#3A2220;color:#F0A196}
.pill.annulé{background:#2A2A2A;color:#9A9A9A;text-decoration:line-through}
.rdv.annulé{opacity:.55}
.st{min-height:36px;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:700;background:var(--c3);color:var(--cream)}
.st.on{outline:2px solid var(--brass)}
.st.venu{color:#8FE0B2}.st.absent{color:#F0A196}.st.annulé{color:#B9B9B9}
.contact{margin-inline-start:auto;display:flex;gap:6px}
.contact a{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--c3);font-size:16px}
.contact a.wa{background:#163A24}
.empty{background:var(--c2);border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--mute)}
.dayhead{font-size:13px;color:var(--mute);margin:14px 0 6px;font-weight:600}

/* forms */
.form{background:var(--c2);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;margin-bottom:16px}
.form label{display:block;font-size:13px;font-weight:600;color:var(--paper);margin-bottom:5px}
.form input,.form select{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px;min-height:48px;color-scheme:dark}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;gap:6px}
.toggle button{flex:1;padding:10px;border-radius:12px;background:var(--bg);border:1.5px solid var(--line);font-weight:600;font-size:14px}
.toggle button[aria-pressed=true]{border-color:var(--brass);color:var(--brass2)}
.item{background:var(--c2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.item .tx{flex:1;min-width:0}
.item b{color:var(--paper)}
.item .s{font-size:13px;color:var(--mute)}
.del{color:#F0A196;font-weight:700;font-size:13px;padding:8px 10px;border-radius:999px;background:#2A1B18}

/* stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.kpi{background:var(--c2);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi b{display:block;font-family:var(--display);font-weight:800;font-size:34px;color:var(--paper);line-height:1.05}
.kpi span{font-size:13px;color:var(--mute)}
.kpi.main{grid-column:1/-1;background:#22301F;border-color:#3F5530}
.kpi.main b{color:var(--brass2);font-size:44px}
.bars{display:grid;gap:8px;background:var(--c2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}
.bars h3{font-size:14px;color:var(--paper);margin-bottom:2px}
.bar{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:10px;font-size:13px}
.bar .t{height:10px;border-radius:6px;background:var(--c3);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--brass);border-radius:6px}
.bar .n{text-align:end;color:var(--paper);font-weight:700}
.bar .l{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:8px}
.chart div{flex:1;background:var(--brass);border-radius:5px 5px 0 0;min-height:2px;position:relative}
.chart div:hover::after{content:attr(data-v);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:11px;background:var(--ink);color:var(--paper);padding:2px 6px;border-radius:6px;white-space:nowrap}
.chartx{display:flex;gap:4px;font-size:10px;color:var(--mute);margin-top:4px}
.chartx span{flex:1;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #3C5848;border-top-color:var(--brass);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-inline-end:6px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section class="login" id="login">
  <h1>Oussama<small>Admin</small></h1>
  <p>Dkhel l-code dyal l-admin.</p>
  <form id="loginForm">
    <input class="pin" id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" aria-label="Code" placeholder="••••">
    <button class="btn full" type="submit" id="loginBtn">Dkhel</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</section>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <header><div class="wrap">
    <div class="brand">Oussama<small>admin</small></div>
    <div style="display:flex;gap:8px">
      <button class="iconbtn" id="refresh" aria-label="Actualiser" title="Actualiser">↻</button>
      <button class="iconbtn" id="logout" aria-label="Khrej" title="Khrej">⎋</button>
    </div>
  </div></header>

  <main class="wrap">
    <!-- RDV -->
    <section id="t-rdv">
      <h2>Rendez-vous</h2>
      <div class="strip" id="dayStrip"></div>
      <div class="summary" id="daySum"></div>
      <div class="list" id="rdvList"></div>
    </section>

    <!-- BLOCAGES -->
    <section id="t-block" hidden>
      <h2>Sedd l-wa9t</h2>
      <p class="sub">Pause, nhar 3otla, l-3id, coiffeur ghayb… L-site kaysedd had l-wa9t direct.</p>
      <form class="form" id="blockForm">
        <div><label for="bDate">Nhar</label><input type="date" id="bDate" required></div>
        <div class="toggle" role="group" aria-label="Mudda">
          <button type="button" data-full="1" aria-pressed="true">Nhar kamel</button>
          <button type="button" data-full="0" aria-pressed="false">Men sa3a l sa3a</button>
        </div>
        <div class="two" id="bTimes" hidden>
          <div><label for="bDe">Men</label><input type="time" id="bDe" step="1800"></div>
          <div><label for="bA">7ta</label><input type="time" id="bA" step="1800"></div>
        </div>
        <div><label for="bWho">Chkoun</label><select id="bWho"></select></div>
        <div><label for="bWhy">Sabab (optionnel)</label><input id="bWhy" maxlength="80" placeholder="Ex: Pause dyal l-ghda"></div>
        <button class="btn full" type="submit" id="bBtn">Sedd had l-wa9t</button>
        <div class="err" id="bErr"></div>
      </form>
      <div class="dayhead">Les blocages jayin</div>
      <div class="list" id="blockList"></div>
    </section>

    <!-- ATTENTE -->
    <section id="t-wait" hidden>
      <h2>Liste d'attente</h2>
      <p class="sub">Clients bghaw blassa f nhar kan m3ammar. Ila t-lghat chi réservation, 3ayet lihom.</p>
      <div class="list" id="waitList"></div>
    </section>

    <!-- STATS -->
    <section id="t-stats" hidden>
      <h2>Statistiques</h2>
      <div class="strip" id="periodStrip"></div>
      <div id="statsBox"></div>
    </section>
  </main>

  <nav class="tabs" role="tablist"><div class="wrap">
    <button role="tab" data-tab="rdv" aria-selected="true"><span>📅</span>Rendez-vous</button>
    <button role="tab" data-tab="block" aria-selected="false"><span>⛔</span>Sedd</button>
    <button role="tab" data-tab="wait" aria-selected="false"><span>⏳</span>Attente<i class="badge" id="waitBadge" hidden></i></button>
    <button role="tab" data-tab="stats" aria-selected="false"><span>📊</span>Stats</button>
  </div></nav>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const DAYS = ["L-7ed","Tnin","Tlat","Larb3","Lkhmis","Jjem3a","Ssebt"];
const MONTHS = ["jan","fév","mars","avr","mai","juin","juil","août","sept","oct","nov","déc"];
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s, n) => { const d = fromIso(s); d.setDate(d.getDate()+n); return iso(d); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => iso(new Date());
const label = s => { const t = today(); if (s === t) return "Lyoum"; if (s === addDays(t,1)) return "Ghedda"; if (s === addDays(t,-1)) return "L-bare7"; const d = fromIso(s); return DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()]; };
const waNum = tel => { let d = String(tel).replace(/\D/g, ""); if (d[0] === "0") d = "212" + d.slice(1); return d; };
let PIN = ""; try { PIN = sessionStorage.getItem("ob_pin") || ""; } catch(e){}

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, 2200); }
async function call(op, extra){
  const r = await fetch(ADMIN.apiUrl, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ action:"admin", pin: PIN, op, ...(extra||{}) }) });
  const j = await r.json();
  if (!j.ok && (j.error === "pin" || j.error === "locked")){ logout(j.error === "locked" ? "Bzaf dyal l-mo7awalat. Tsenna 15 dqi9a." : "Code ghalat."); throw new Error("auth"); }
  return j;
}

/* ---------- login ---------- */
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  PIN = $("#pin").value.trim(); if (!PIN) return;
  $("#loginBtn").disabled = true; $("#loginErr").textContent = "";
  try {
    const j = await call("login");
    if (j.ok){ try { sessionStorage.setItem("ob_pin", PIN); } catch(e){} start(); }
    else if (j.error === "action" || j.error === "op") $("#loginErr").textContent = "Backend 9dim: khass déploiement jdid f Apps Script.";
  } catch(err){ if (err.message !== "auth") $("#loginErr").textContent = "Ma kaynach connexion."; }
  $("#loginBtn").disabled = false;
});
function logout(msg){
  PIN = ""; try { sessionStorage.removeItem("ob_pin"); } catch(e){}
  $("#app").hidden = true; $("#login").hidden = false; $("#pin").value = ""; $("#loginErr").textContent = msg || "";
}
$("#logout").addEventListener("click", () => logout());

/* ---------- tabs ---------- */
let tab = "rdv";
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab;
  document.querySelectorAll("nav.tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  ["rdv","block","wait","stats"].forEach(k => $("#t-"+k).hidden = k !== tab);
  load(); window.scrollTo(0,0);
}));
$("#refresh").addEventListener("click", () => load());
function load(){ ({ rdv: loadRdv, block: loadBlocks, wait: loadWait, stats: loadStats })[tab](); }

/* ---------- rendez-vous ---------- */
let day = today();
function renderStrip(){
  const t = today(), days = [-1,0,1,2,3,4,5,6].map(n => addDays(t, n));
  $("#dayStrip").innerHTML = days.map(d => `<button type="button" data-d="${d}" aria-pressed="${d===day}">${label(d)}</button>`).join("") +
    `<input type="date" id="pickDay" value="${day}" aria-label="Khtar nhar">`;
  $("#dayStrip").querySelectorAll("button").forEach(b => b.onclick = () => { day = b.dataset.d; renderStrip(); loadRdv(); });
  $("#pickDay").onchange = e => { if (e.target.value){ day = e.target.value; renderStrip(); loadRdv(); } };
}
async function loadRdv(){
  renderStrip();
  $("#rdvList").innerHTML = `<div class="empty"><span class="spin"></span>Kanjibou…</div>`; $("#daySum").innerHTML = "";
  try {
    const j = await call("list", { from: day, to: day });
    const list = j.list || [], live = list.filter(r => !r.statut.startsWith("annul"));
    $("#daySum").innerHTML = `<div><b>${live.length}</b><span>Rendez-vous</span></div>
      <div><b>${live.filter(r => r.statut === "venu").length}</b><span>Jaw</span></div>
      <div><b>${live.filter(r => !r.statut.startsWith("absent")).reduce((a,r) => a + r.prix, 0)}</b><span>DH (prévu)</span></div>`;
    if (!list.length){ $("#rdvList").innerHTML = `<div class="empty">Ma kayn 7ta rendez-vous ${label(day).toLowerCase() === "lyoum" ? "lyoum" : "f had nhar"}.</div>`; return; }
    $("#rdvList").innerHTML = list.map(r => `
      <article class="rdv ${esc(r.statut)}">
        <div class="h">${esc(r.heure)}<small>${r.dur} min</small></div>
        <div class="who">${esc(r.nom)} <span class="pill ${esc(r.statut)}">${esc(r.statut)}</span></div>
        <div class="what">${esc(r.services)} · ${r.prix} DH · 💈 ${esc(r.barber)}</div>
        <div class="row">
          ${["venu","absent","annulé"].map(s => `<button class="st ${s} ${r.statut===s?"on":""}" data-id="${esc(r.id)}" data-s="${s}">${{venu:"✓ Ja",absent:"✗ Ma jach",annulé:"Lgha"}[s]}</button>`).join("")}
          <div class="contact">
            <a href="tel:${esc(r.tel)}" aria-label="3ayet l ${esc(r.nom)}">📞</a>
            <a class="wa" href="https://wa.me/${waNum(r.tel)}" target="_blank" rel="noopener" aria-label="WhatsApp ${esc(r.nom)}">💬</a>
          </div>
        </div>
      </article>`).join("");
    $("#rdvList").querySelectorAll(".st").forEach(b => b.onclick = async () => {
      const s = b.classList.contains("on") ? "confirmé" : b.dataset.s;
      b.disabled = true;
      try { const j = await call("status", { id: b.dataset.id, statut: s }); if (j.ok){ toast("Tsjjel ✓"); loadRdv(); } else { toast("Ma tsjjelch"); b.disabled = false; } }
      catch(e){ b.disabled = false; }
    });
  } catch(e){ if (e.message !== "auth") $("#rdvList").innerHTML = `<div class="empty">Ma kaynach connexion. <button class="btn sm ghost" onclick="location.reload()">3awed</button></div>`; }
}

/* ---------- blocages ---------- */
let fullDay = true;
$("#bWho").innerHTML = `<option value="tous">Salon kamel</option>` + ADMIN.coiffeurs.map(c => `<option>${esc(c)}</option>`).join("");
$("#bDate").value = today(); $("#bDate").min = today();
document.querySelectorAll("[data-full]").forEach(b => b.onclick = () => {
  fullDay = b.dataset.full === "1";
  document.querySelectorAll("[data-full]").forEach(x => x.setAttribute("aria-pressed", x === b));
  $("#bTimes").hidden = fullDay;
});
$("#blockForm").addEventListener("submit", async e => {
  e.preventDefault(); $("#bErr").textContent = "";
  const de = fullDay ? "" : $("#bDe").value, a = fullDay ? "" : $("#bA").value;
  if (!fullDay && (!de || !a || a <= de)){ $("#bErr").textContent = "Sa3a dyal l-bdya khass tkoun 9bel sa3a dyal l-akhir."; return; }
  $("#bBtn").disabled = true;
  try {
    const j = await call("block", { date: $("#bDate").value, de, a, coiffeur: $("#bWho").value, raison: $("#bWhy").value.trim() });
    if (j.ok){ toast("Tsedd ✓"); $("#bWhy").value = ""; loadBlocks(); } else $("#bErr").textContent = "Ma tsjjelch. Tchecki l-nhar w s-sa3a.";
  } catch(err){ if (err.message !== "auth") $("#bErr").textContent = "Ma kaynach connexion."; }
  $("#bBtn").disabled = false;
});
async function loadBlocks(){
  $("#blockList").innerHTML = `<div class="empty"><span class="spin"></span>Kanjibou…</div>`;
  try {
    const j = await call("blocks"), list = j.list || [];
    if (!list.length){ $("#blockList").innerHTML = `<div class="empty">Ma kayn 7ta blocage jay.</div>`; return; }
    $("#blockList").innerHTML = list.map(b => `<div class="item"><div class="tx">
        <b>${esc(label(b.date))} · ${b.de ? esc(b.de) + "–" + esc(b.a) : "nhar kamel"}</b>
        <div class="s">${b.coiffeur === "tous" ? "Salon kamel" : "💈 " + esc(b.coiffeur)}${b.raison ? " · " + esc(b.raison) : ""}</div></div>
        <button class="del" data-id="${esc(b.id)}">7ayed</button></div>`).join("");
    $("#blockList").querySelectorAll(".del").forEach(b => b.onclick = async () => {
      if (b.dataset.armed !== "1"){ b.dataset.armed = "1"; b.textContent = "Akked?"; return; }
      b.disabled = true;
      try { const j = await call("unblock", { id: b.dataset.id }); if (j.ok){ toast("Tm7a ✓"); loadBlocks(); } } catch(e){ b.disabled = false; }
    });
  } catch(e){ if (e.message !== "auth") $("#blockList").innerHTML = `<div class="empty">Ma kaynach connexion.</div>`; }
}

/* ---------- attente ---------- */
async function loadWait(){
  $("#waitList").innerHTML = `<div class="empty"><span class="spin"></span>Kanjibou…</div>`;
  try {
    const j = await call("waitlist"), list = j.list || [];
    const pending = list.filter(w => w.statut.includes("attente"));
    $("#waitBadge").hidden = !pending.length; $("#waitBadge").textContent = pending.length;
    if (!list.length){ $("#waitList").innerHTML = `<div class="empty">Ma kayn 7ta wa7ed f liste d'attente.</div>`; return; }
    $("#waitList").innerHTML = list.map(w => `<div class="item"><div class="tx">
        <b>${esc(w.nom)}</b> <span class="pill ${w.statut.includes("attente") ? "confirmé" : "venu"}">${esc(w.statut)}</span>
        <div class="s">${esc(label(w.date))} · ${esc(w.services)}${w.barber ? " · 💈 " + esc(w.barber) : ""}</div></div>
        <div class="contact"><a href="tel:${esc(w.tel)}" aria-label="3ayet">📞</a><a class="wa" href="https://wa.me/${waNum(w.tel)}?text=${encodeURIComponent("Salam " + w.nom + " 👋 t7llat blassa f Oussama Barber " + label(w.date).toLowerCase() + ". Mazal bghiti?")}" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a></div>
        ${w.statut.includes("attente") ? `<button class="btn sm ghost" data-id="${esc(w.id)}">Tsselt</button>` : ""}</div>`).join("");
    $("#waitList").querySelectorAll("button[data-id]").forEach(b => b.onclick = async () => {
      b.disabled = true; try { const j = await call("waitdone", { id: b.dataset.id }); if (j.ok) loadWait(); } catch(e){ b.disabled = false; }
    });
  } catch(e){ if (e.message !== "auth") $("#waitList").innerHTML = `<div class="empty">Ma kaynach connexion.</div>`; }
}

/* ---------- stats ---------- */
let period = "week";
function range(p){
  const t = today(), d = new Date();
  if (p === "week"){ const dow = (d.getDay() + 6) % 7; return [addDays(t, -dow), t]; }
  if (p === "month") return [iso(new Date(d.getFullYear(), d.getMonth(), 1)), t];
  if (p === "last"){ return [iso(new Date(d.getFullYear(), d.getMonth()-1, 1)), iso(new Date(d.getFullYear(), d.getMonth(), 0))]; }
  return [addDays(t, -29), t];
}
function renderPeriods(){
  const P = { week:"Had s-simana", month:"Had ch-chhar", last:"Ch-chhar li fat", d30:"30 yawm" };
  $("#periodStrip").innerHTML = Object.entries(P).map(([k,v]) => `<button type="button" data-p="${k}" aria-pressed="${k===period}">${v}</button>`).join("");
  $("#periodStrip").querySelectorAll("button").forEach(b => b.onclick = () => { period = b.dataset.p; loadStats(); });
}
function barsHtml(title, obj){
  const e = Object.entries(obj).sort((a,b) => b[1]-a[1]); if (!e.length) return "";
  const max = e[0][1];
  return `<div class="bars"><h3>${title}</h3>${e.map(([k,v]) => `<div class="bar"><span class="l">${esc(k)}</span><span class="t"><i style="width:${Math.round(v/max*100)}%"></i></span><span class="n">${v}</span></div>`).join("")}</div>`;
}
async function loadStats(){
  renderPeriods();
  $("#statsBox").innerHTML = `<div class="empty"><span class="spin"></span>Kan7esbou…</div>`;
  const [from, to] = range(period);
  try {
    const j = await call("stats", { from, to }), s = j.stats;
    const days = []; for (let d = from; d <= to; d = addDays(d, 1)) days.push(d);
    const maxV = Math.max(1, ...days.map(d => s.days[d] || 0));
    const absRate = s.confirmed ? Math.round(s.absent / s.confirmed * 100) : 0;
    $("#statsBox").innerHTML = `
      <div class="kpis">
        <div class="kpi main"><b>${s.revenue} DH</b><span>Dkhal (bla les absents w les annulations)</span></div>
        <div class="kpi"><b>${s.confirmed}</b><span>Réservations</span></div>
        <div class="kpi"><b>${s.clients}</b><span>Clients mkhtalfin</span></div>
        <div class="kpi"><b>${s.cancelled}</b><span>Tlghaw</span></div>
        <div class="kpi"><b>${absRate}%</b><span>Ma jawch (${s.absent})</span></div>
      </div>
      ${days.length <= 31 ? `<div class="bars"><h3>Dkhal kol nhar (DH)</h3>
        <div class="chart">${days.map(d => `<div style="height:${Math.round((s.days[d]||0)/maxV*100)}%" data-v="${label(d)}: ${s.days[d]||0} DH"></div>`).join("")}</div>
        <div class="chartx">${days.map((d,i) => `<span>${i % Math.ceil(days.length/7) === 0 ? fromIso(d).getDate() : ""}</span>`).join("")}</div></div>` : ""}
      ${barsHtml("Les services", s.services)}
      ${barsHtml("Les coiffeurs", s.barbers)}`;
  } catch(e){ if (e.message !== "auth") $("#statsBox").innerHTML = `<div class="empty">Ma kaynach connexion.</div>`; }
}

/* ---------- start ---------- */
function start(){
  $("#login").hidden = true; $("#app").hidden = false;
  load();
  call("waitlist").then(j => { const n = (j.list || []).filter(w => w.statut.includes("attente")).length; $("#waitBadge").hidden = !n; $("#waitBadge").textContent = n; }).catch(() => {});
}
if (PIN) start();
})();
</script>
